<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="js/index.js"></script>
  <title></title>

  <script type="module" src="components/top-nav.js"></script>
</head>
<body>
  <top-nav></top-nav>
  
  <img class="bg-img" src="images/SplashFox.jpg">
  
  <div class="popup welcome-box">
    <h1>Your artwork on time</h1>
    <p>Gather the power of cloud computing for a smooth rendering experience.</p>
    <img src="images/BlenderLogo.svg" alt="Blender Logo">      
    <div>
      <button class="basic-button" onclick="claimFreeCredits()">
        Claim your free credits
      </button>
    </div>
  </div>
  
  <div class="centered-overlay">
    <div class="popup">
      <h1>Sign up</h1>
      <form method="post" class="login-form">
        <label>Email</label>
        <input type="email">
        <label>Password</label>
        <input type="password">
        <label>Confirm password</label>
        <input type="password">
        <button type="submit" class="basic-button">Sign up</button>
        <p>Already have an account? <a href="https://www.google.com">Log in</a></p>
      </form>
    </div>
  </div>
  
  <div></div>
</body>
</html>
