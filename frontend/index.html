<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="utf-8">
  
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/index.js"></script>
  <title></title>

  <script type="module" src="components/top-nav.js"></script>
</head>
<body>
  <top-nav></top-nav>
  
  <img class="bg-img" src="images/SplashFox.jpg">
  
  <div class="popup fixed inset-0 sm:ml-38 mt-38 w-screen sm:w-110 h-fit flex flex-col px-12 py-10 welcome-box text-base">
    <h1 class="text-3xl font-bold mb-6">Your artwork on time</h1>
    <p>Gather the power of cloud computing for a smooth rendering experience.</p>
    <img src="images/BlenderLogo.svg" alt="Blender Logo" class="my-8 h-16">
    <button class="highlighted-button mx-auto p-2" onclick="claimFreeCredits()">
      Claim your free credits
    </button>
  </div>
  
  <div id="signup-form" class="fixed inset-0 hidden items-center justify-center bg-black/50 z-100">
    <div class="popup flex flex-col px-8 py-6 w-screen h-screen sm:h-auto sm:w-sm">
      <h1 class="font-bold text-3xl">Sign up</h1>
      <form method="post" class="simple-form">
        <label>Email</label>
        <input type="email" class="simple-text-input">
        <label>Password</label>
        <input type="password" class="simple-text-input">
        <label>Confirm password</label>
        <input type="password" class="simple-text-input">
        <button type="submit" class="highlighted-button p-4 mt-6 w-40 mx-auto">Sign up</button>
        <p class="mt-4">
          Already have an account? <a href="https://www.google.com">Log in</a>
        </p>
      </form>
    </div>
  </div>
  
  <div></div>
</body>
</html>
